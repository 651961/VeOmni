# MiniMax-H3 LongCat-style spatial refinement cache generation.
# input_video is RGB-upsampled to target geometry before VAE encoding.
model:
  condition_model_path: /ai_share/models/MiniMax-H3/FL2VA/transformer/config.json
  config_path: /ai_share/models/MiniMax-H3/FL2VA/transformer/config.json
  condition_model_cfg:
    base_model_path: /ai_share/models/MiniMax-H3/FL2VA
    video_vae_subfolder: video_vae/source
    skip_encoder_load: false
    refinement_mode: true
    refinement_t_thresh: 0.5
    use_keyframe_condition: true
    keyframe_indices: [0]
    training_cfg_scale: 4.0
    sigma_shift_video: 12.0
    sigma_shift_audio: 3.0
    imgvid_cond_noise_aug: 0.999
    audio_cond_noise_aug: 1.0
  optimizer:
    type: adamw
    lr: 1.0e-4
  accelerator:
    init_device: meta
    ulysses_size: 1
    gradient_checkpointing:
      enable: false
    fsdp_config:
      fsdp_mode: fsdp2
      offload: false
      mixed_precision:
        enable: false

data:
  train_path: /ai_share/zsqiao/codes/sr_dataset_ultravideo_124f24_vae8/metadata_refinement.csv
  data_type: diffusion
  source_name: minimax_h3_refinement
  data_transform: minimax_h3_refinement_online
  datasets_type: mapping
  log_sample: false
  text_keys: text
  dataloader:
    type: native
    num_workers: 0
    drop_last: false
    shuffle: false
  mm_configs:
    data_dir: /
    fps: 24
    min_frames: 124
    max_frames: 124
    video_max_pixels: 2097152
    keyframe_indices: [0]
  offline_embedding_save_dir: /ai_share/zsqiao/codes/video_gen/VeOmni/dataset/h3_refinement_embedding

train:
  training_task: offline_embedding
  global_batch_size: 8
  micro_batch_size: 1
  dyn_bsz: false
  seed: 42
  num_train_epochs: 1
  checkpoint:
    output_dir: /ai_share/zsqiao/codes/sr_dataset_ultravideo_124f24_vae8/h3_refinement_embedding
    save_steps: 0
    save_hf_weights: false
  wandb:
    enable: false
    project: minimax_h3_fl2va
